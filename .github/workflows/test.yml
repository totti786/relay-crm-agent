name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doctor
        run: ./relay doctor
      - name: Regression suite
        run: ./relay selftest
